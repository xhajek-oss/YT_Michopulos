idnes:
  timezone: Europe/Prague
  max_pages_per_query: 5

  # Search terms are intentionally tied to the sports-event sources we currently ingest.
  # More sports can be added without changing scraper code.
  search_queries:
    - atletika
    - biatlon
    - hokej

  # iDNES channel slug (from URL) -> canonical channel name.
  # ČT sport Plus is NOT here: it is an online-only ČT source and will use the ČT scraper.
  channels:
    ct-1: "ČT1"
    ct-2: "ČT2"
    ct-4-sport: "ČT sport"
    eurosport: "Eurosport 1"
    eurosport-2: "Eurosport 2"
    nova-sport: "Nova Sport 1"
    nova-sport-2: "Nova Sport 2"
    nova-sport-3: "Nova Sport 3"
    nova-sport-4: "Nova Sport 4"
    nova-sport-5: "Nova Sport 5"
    nova-sport-6: "Nova Sport 6"
    oneplaysport-1: "Oneplay Sport 1"
    oneplaysport-2: "Oneplay Sport 2"
    oneplaysport-3: "Oneplay Sport 3"
    oneplaysport-4: "Oneplay Sport 4"
    premier-sport: "Premier Sport 1"
    premier-sport-2: "Premier Sport 2"
    premier-sport-3: "Premier Sport 3"
    sport-1: "Sport1"
    sport-2: "Sport2"
    prima-sport: "Prima Sport"
