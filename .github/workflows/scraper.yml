name: Sports Events Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore validation baseline
        uses: actions/cache@v4
        with:
          path: data/validation_state.json
          key: validation-state-${{ github.run_id }}
          restore-keys: |
            validation-state-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python main.py
