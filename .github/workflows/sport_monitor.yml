name: Sport Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Režim spuštění"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: write

jobs:
  sport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Probe TV sources
        run: |
          python tv_probe.py

      - name: Run Sport monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sport_monitor.py ${{ inputs.mode }}

      - name: Save sport state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/sport_state.json

          if git diff --cached --quiet; then
            echo "No sport state changes."
          else
            git commit -m "Update sport monitor state"
            git push
          fi
